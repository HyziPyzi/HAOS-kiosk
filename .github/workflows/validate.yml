name: Validate Chrome DRM app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-tv-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: TV and iPhone viewport E2E
        env:
          PW_CHANNEL: chromium
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/smart-tv-screenshots
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-tv-frontend-evidence
          path: |
            ${{ runner.temp }}/smart-tv-screenshots/
            dev/frontend/playwright-report/
            dev/frontend/test-results/
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp PyYAML
      - name: Smart TV auth, real TLS/WS, HA and CDP fixtures
        env:
          PYTHONPATH: haoskiosk
        run: python -m unittest discover -s tests -p test_smart_tv.py -v
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher JavaScript syntax
        run: node --check haoskiosk/launcher/app.js
      - name: Build amd64 app locally (no image publication)
        run: docker build --platform linux/amd64 --build-arg BUILD_ARCH=amd64 -t haoskiosk-chrome:test haoskiosk
      - name: Dockerfile lint
        run: docker run --rm --entrypoint hadolint -v "$PWD:/src:ro" hadolint/hadolint:latest-alpine --ignore DL3008 /src/haoskiosk/Dockerfile
      - name: Build local test environment
        run: docker build -f tests/Dockerfile -t haoskiosk-chrome:checks .
      - name: Policies, Web Store install, X11 Chrome, launcher, profile restart and Widevine EME
        run: |
          mkdir -p "$RUNNER_TEMP/launcher-screenshots"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/launcher-screenshots:/screenshots" -e LAUNCHER_SCREENSHOT_DIR=/screenshots haoskiosk-chrome:checks
      - name: Launcher screenshot at 1920x1080
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-preview
          path: ${{ runner.temp }}/launcher-screenshots/*.png
          if-no-files-found: ignore
      - name: Validate app with stable Supervisor
        if: ${{ !cancelled() }}
        run: docker run --rm --entrypoint python3 -v "$PWD:/src:ro" ghcr.io/home-assistant/amd64-hassio-supervisor:2026.09.3 /src/tests/validate_supervisor.py
      - name: Documentation copies
        if: ${{ !cancelled() }}
        run: |
          cmp README.md haoskiosk/README.md
          cmp README.md haoskiosk/DOCS.md
