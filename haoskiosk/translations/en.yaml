---
configuration:
  ha_username:
    name: "HA Username"
    description: "Optional Home Assistant user for automatic login; manual login is also supported."
  ha_password:
    name: "HA Password"
    description: "Optional Home Assistant password for automatic login; never logged."
  ha_url:
    name: "HA URL"
    description: |
      Base URL for HA [Default: http://localhost:8123]
      Note: Typically should not need to be changed since browser runs on the
      'localhost' server
  ha_dashboard:
    name: "HA Dashboard"
    description: 'Dashboard path (following "HA URL") [Default: ""]'
  login_delay:
    name: "Login Delay"
    description: |
      Time to wait for login page to load in seconds [Default: 1.0]
      Note: Often can set to '0'
  zoom_level:
    name: "Zoom Level"
    description: "Zoom factor 100 = 100% [Default: 100]"
  browser_refresh:
    name: "Browser Refresh"
    description: |
      Browser refresh interval in seconds; 0 for never [Default: 600]
      Note: Recommended since on RPi, console messages can overwrite browser
  browser_engine:
    name: "Browser Engine"
    description: |
      Official Google Chrome Stable on Debian. chromium is a compatibility
      alias for the same Google Chrome binary. [Default: chrome]
    items:
      chrome: "Google Chrome Stable"
      chromium: "Google Chrome Stable (compatibility alias)"
  start_page:
    name: "Start page"
    description: "TV Launcher by default; choose home_assistant to restore the previous HA dashboard startup."
    items:
      launcher: "TV Launcher"
      home_assistant: "Home Assistant dashboard"
  adblock_mode:
    name: "Ad blocking"
    description: "Official uBlock Origin Lite via Chrome policy. Optimal is recommended; Complete adds broader cosmetic filtering. Off disables the extension. Restart the app after changes."
    items:
      "off": "Off"
      optimal: "Optimal"
      complete: "Complete"
  adblock_excluded_domains:
    name: "Sites without ad blocking"
    description: "Bare hostnames, including subdomains (e.g. netflix.com, max.com, primevideo.com). Replace the list to customize; [] means no managed exceptions. Restart the app after changes."
  screen_timeout:
    name: "Screen Timeout"
    description: "Time in seconds until screen blanks; 0 for never [Default: 0]"
  output_number:
    name: "Output Number"
    description: |
      Choose which of the *connected* video output ports to use.
      Set to 1 to use the first connected port. [Default: 1]
  dark_mode:
    name: Dark Mode
    description: "Prefer dark mode where supported if `True` [Default: True]"
  ha_theme:
    name: "HA Theme"
    description: 'Optional HA Theme [Default: ""]'
  ha_sidebar:
    name: "HA Sidebar"
    description: "Status of left sidebar [Default: None]"
    items:
      full: "Full"
      narrow: "Narrow"
      none: "None"
  rotate_display:
    name: "Rotate Display"
    description: "Rotate display [Default: Normal]"
    items:
      normal: "Normal (no rotation)"
      left: "Left (90deg CCW)"
      right: "Right (90deg CW)"
      inverted: "Inverted (180deg)"
  map_touch_inputs:
    name: "Map Touch Inputs"
    description: |
      If 'True', then map all touch pointer inputs to the selected
      video output. In particular, this rotates touch input devices
      consistently with the video output. [Default: True]
  cursor_timeout:
    name: "Cursor Timeout"
    description: |
      Time in seconds for cursor to re-hide after last mouse movement
      or touch. Set to '0' to always show cursor. Set to '-1' to never
      show cursor. [Default: 5 seconds]
  keyboard_layout:
    name: "Keyboard Layout"
    description: "X11 keyboard layout [Default: pl]"
  onscreen_keyboard:
    name: "Onscreen Keyboard"
    description: "Display an Onscreen Keyboard for text input [Default: True]"
  save_onscreen_config:
    name: "Save Onscreen Config"
    description: |
      Save and Restore changes to Onscreen keyboard settings [Default: True]
  xorg_conf:
    name: "xorg.conf file"
    description: |
      Insert custom 'xorg.conf' code [Default: ""]
  xorg_append_replace:
    name: "Append or Replace"
    description: |
      Choose whether to append to original 'xorg.conf'
      or replace it [Default: Append]
    items:
      append: "Append"
      replace: "Replace"
  audio_sink:
    name: "Audio Sink"
    description: "Audio output sink [Default: Auto]"
    items:
      auto: "Auto"
      hdmi: "HDMI"
      usb: "USB"
      none: "None"
  rest_ip:
    name: "REST IP address"
    description: |
      Listening IP address for REST API server [Default: `127.0.0.1`]
      Binding outside localhost requires a bearer token. Use only a trusted LAN.
  rest_port:
    name: "REST Port"
    description: |
      Listening port for REST API server (1024-49151) [Default: 8080]
  rest_bearer_token:
    name: "REST Authorization Token"
    description: |
      Optional on localhost; required when listening outside localhost. [Default: ""]
      If set add the line `-H "Authorization: Bearer <REST_BEARER_TOKEN>"`
      to your REST API calls.
  smart_tv_remote:
    name: "Enable HTTPS phone remote"
    description: "Off by default. Requires a trusted local TLS certificate and exact HTTPS origin. Never expose to the internet."
  smart_tv_origin:
    name: "Remote HTTPS origin"
    description: "Exact address without path, for example https://192.168.1.50:8443. Must match certificate SAN and Safari address."
  smart_tv_bind:
    name: "Remote listening address"
    description: "Prefer the NUC private LAN address. 0.0.0.0 listens on all IPv4 interfaces; restrict with your LAN firewall."
  smart_tv_port:
    name: "Remote HTTPS port"
    description: "Default 8443. Separate from legacy REST and Home Assistant. No router port forwarding."
  smart_tv_cert:
    name: "TLS certificate path"
    description: "PEM server certificate in the add-on private config directory. See docs/smart-tv-v3/HTTPS.md."
  smart_tv_key:
    name: "TLS private key path"
    description: "PEM private key, permissions 0600. Never place in a public web directory; keep the root CA key offline."
  gestures:
    name: Gesture Command List
    description: |
      Add JSON-like gesture string key and gesture command value pairs. See
      README for formatting Earlier keys take precedence over later keys
  command_whitelist:
    name: "Command Whitelist Regex"
    description: |
      Regex of runnable user commands for the REST API and for use in
      gesture commands. See README for details
  touch_debug_level:
    name: "Touch Debug Level"
    description: |
      Debug verbosity for mouse/touch gesture parsing. Use 1 for normal logs,
      2-3 to inspect real tap/swipe/pinch handling, and higher values only for
      deep parser debugging. [Default: 1]
  vnc_server:
    name: "VNC Server Password"
    description: |
      Empty disables VNC. A password enables VNC on localhost:5900 only;
      access through an SSH tunnel. Passwordless VNC is disabled.
  debug_mode:
    name: "Debug Mode"
    description: |
      Launch X and Openbox without Chrome. [Default: False]
