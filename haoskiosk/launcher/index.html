<!doctype html>
<html lang="pl" data-motion="full" data-wallpaper="dusk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart TV · Ekran główny</title>
  <link rel="preload" href="/launcher/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/launcher/style.css">
  <script src="/launcher/app.js" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="glow" id="glow"></div></div>
  <div class="safe" id="safe">
    <main id="screen-home" class="screen" aria-label="Ekran główny">
      <header class="topbar">
        <button class="profile-chip" id="profile-chip" data-nav data-key="top:profile" aria-haspopup="dialog"></button>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <div class="scroller" id="home-scroller" data-scroll>
        <section class="hero" aria-label="Godzina i pogoda">
          <time class="clock" id="clock"></time>
          <p class="date" id="date"></p>
          <p class="ambient" id="ambient"></p>
        </section>
        <div class="rows" id="rows"></div>
      </div>
    </main>
    <section id="screen-apps" class="screen" aria-label="Aplikacje" hidden></section>
    <section id="screen-dom" class="screen" aria-label="Dom" hidden></section>
    <section id="screen-settings" class="screen" aria-label="Ustawienia" hidden></section>
  </div>
  <div id="layers"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Ekran główny wymaga JavaScriptu. Naciśnij Ctrl + Alt + H, aby odświeżyć.</p></noscript>
</body>
</html>
